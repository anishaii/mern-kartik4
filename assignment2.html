<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            height: 300px;
            width: 300px;
            border: 1px solid red;

        }

            height: 300px;
            width: 300px;
            border: 1px solid red;

        .box3{

            width: 200px;
            border: 1px solid red;
            background-color: purple;
            position: absolute;

            left: 60px;
            top: 50px;
    
        }
        .box5{
            height: 150px;
            width: 150px;
            border: 1px solid red;
            background-color: lime;

            left: 20px;
            top: 20px;

        } 
         .box4{
            height: 220px;
            width: 230px;
            border: 1px solid red;
            background-color: coral;
            position: absolute;
            z-index: 2;
            top: 100px;
            left: 90px;
         }
         button{
            position: absolute;
            top: 20px;
            left: 400px;

         }
       
     
    </style>
</head>
<body>
    <a href="index.html">
        <button>Back</button>
    </a>
    <div class="box1">
