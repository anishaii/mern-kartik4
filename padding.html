<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .boxa{
            height: 200px;
            width: 200px;
            background-color: lightblue;
            padding: 10px 20px;
            /*border-top: 4px blue;*/
            outline: 2px solid green;
            
            border: 5px solid red;

            border-top-left-radius: 60px;
            border-bottom-right-radius: 20px;
            /*border-top: 4px blue;
            box-shadow: 10px 10px 5px yellow;
            x axis, yxis, blur, spread ,color
            properties
            */
            box-shadow: rgb(38, 57, 77) 0px 20px 30px -10px;

             
        }
        h1{
            background-color: lightcoral;
            display: inline;

        }
        span{
            background-color: lightgreen;
            display: inline-block;
            height: 100px;
            width: 200px;
        }
        .boxy{
            height: 200px;
            width: 200px;
            background-color: lime;
            position: absolute;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="boxa">
        <h2>box</h2>
    </div>

    <br>

    <h1>block</h1>
    <span>inline</span>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Veniam nihil deserunt nesciunt provident minus eum eius. 
        Enim voluptatum deserunt vel.Quasi, quibusdam? Asperiores maiores provident iure vel voluptates modi odit.</p>
    <div class="boxy"></div>

</body>
</html>
