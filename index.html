<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      body{
         background-color: #5847EF;
      }
      .pbox{
         height: 400px;
         width: 400px;
         background-color:#7138D5;
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         border-radius: 5px;
         
        
         
      }
      .box2{
         height: 300px;
         width: 300px;
         background-color: #527B81;
         margin: 30px 50px;
      }
      .box3{
         height: 200px;
         width: 200px;
         background-color:#A1A980;
         margin:30px 50px;
      }
      .box4{
         height: 60px;
         width: 80px;
         background-color: #B25DD2;
         border-radius: 3px;
       
      }
    

   </style>
</head>
<body>
   <div class="pbox">box-1
      <div class="box2">box-2
         <div class="box3">
            <div class="box4">box-3</div>
           
         </div>
      </div>
   </div>
   
</body>
</html>
