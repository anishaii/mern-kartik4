<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body {
    background: #2b1f17;
    font-family: Arial, sans-serif;
}

.box {
    width: 900px;
    margin: 40px auto;
    background: #3a2b22;
    border-radius: 20px;
    padding: 20px;
    color: white;
    border: 4px solid white;
}


.top {
    background: #ffcf32;
    color: black;
    padding: 30px;
    border-radius: 10px;
}


.middle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
}

.cup,
.shirt {
    background: #222;
    border-radius: 10px;
    padding: 10px;
}

.cup img,
.shirt img {
    height: 250px;
    width: 100%;
    border-radius: 6px;
}


.bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
}

.menu {
    background: #4c362a;
    border-radius: 10px;
    padding: 15px;
}

.menu p {
    margin: 6px 0;
    font-weight: 600;
}

.cta {
    background: #5b7b3c;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: #ffd970;
}



    </style>
</head>
<body>
    <div class="box">

    <div class="top">
        <h2>Strike Fast,<br> Sip Slow</h2>
        <p>BrewBolt is a haven for those who chase the storm but relish the calm.</p>
    </div>

    <div class="middle">
        <div class="cup">
            <img src="https://images.unsplash.com/photo-1525391832543-432b7e058cb0?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Cup">

        </div>

        <div class="shirt">
            <img src="https://images.unsplash.com/photo-1481833761820-0509d3217039?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Shirt">
        </div>
    </div>

    <div class="bottom">
        <div class="menu">
            <p>BuzzBrew</p>
            <p>Zapuccino</p>
            <p>ShockoLatte</p>
            <p>FlashFrappe</p>
            <p>FusionFlat</p>
        </div>

        <div class="cta">
            <h3>Taste the Spark. Live the Charge.</h3>
            <p>brewbolt.co</p>
        </div>
    </div>

</div>

</body>
</html>
