<!DOCTYPE html>
<html lang="en">
<head>

    <fieldset>
        <!-- fieldset creates border -->
        <legend>Contact</legend>
         <form  action="mailto:anishagc83@gmail.com" method="post" enctype="text/plain">
        <p>
            <label for="email">Email</label>
            <input name="mail" required id="email" type="email" placeholder="example@gmail.com">
        </p>
        <p>
            <label for="fullname">Username</label>
            <input name="fname" id="fullname" type="text" placeholder="Pablo Picaso">
        </p>
        <p>
            <h3>Select your Gender</h3>
            <label for="male">Male</label>
            <input id="male" name="gender" type="radio" value="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">

           
            <!-- <label for="male">Male</label>
            <input type="radio" id="male" value="male" name="gender">
            <label for="female">Female</label>
            <input type="radio" id="female" value="female" name="gender"> -->
        </p>

        <p>
            <h3>Select Your Habits</h3>
            <label for="dance">dance</label>
            <input type="checkbox" id="dance" value="dance" name="habits">
            <label for="female">Sing</label>
            <input type="checkbox" id="sing" value="sing" name="habits">
            
        </p>
        <p>
            <label for="dob">Date of Birth</label>
            <input value="dob" id="dob" name="DOB" type="date">
        </p>
          <p>
            <label for="country">Select your Country</label>
            <select name="nation" id="country">
                <optgroup label="Nepal">
                    <option value="bhaktapur">Bhaktapur</option>
                    <option value="kathmandu">kathmandu</option>
                </optgroup>
                <option value="India">India</option>
                <option value="China">China</option>
            </select>
        </p>
        <p>
            <h4>Your Feedback</h4>
            <textarea name="feedback" id="feed" rows="5" cols="30"></textarea>
        </p>
      

        <button type="submit">Submit</button>
        

    </form>

    </fieldset>
   

</body>
</html>
