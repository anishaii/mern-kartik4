<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        * {
           margin:0;
           padding: 3px;
           box-sizing: border-box;
           font-family: DM Sans, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            
            
        }
        .flex{
            height: 80px;
            width: 120px;
        }
        .list ul{
            list-style: none;
            display: flex;
            gap: 25px;
        }


        .signup{
            background-color: #2CD165;
            color: white;
            border-radius: 5px;
            border: none;
            height: 35px;
            width: 80px;
            
        }
        .login{
            background-color: white;
            border: none;
            width: 60px;
        }

        .parent {
            min-width:600px;
            height: 400px;
            display: flex;
            gap: 250px;
            margin:  200px auto;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
            margin-bottom: 0;
        }
        .part {
            height: 300px;
            width: 500px;
           
            
        }
        .part h1{
            margin-bottom: 15px;
            color: #283443;
            font-size: 50px;
        }
        .part p{
            margin-bottom: 20px;
        }

        img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 30px;
        }

        .part1{
            height: 400px;
            width: 500px;
           
          
            
        }
        .b1 {
            background-color: #2CD165;
            border-radius: 38px;
            border: none;
            width: 60px;
            margin-bottom: 10px;
        }
        .b2 {
            background-color: #2CD165;
            height: 40px;
            border-radius: 5px;
            border: none;
            color: white;
        
        }
        .b3{
            background-color: white;
            border: 2px solid #EEEEEE;
            height: 40px;
            width: 80px;
            border-radius: 5px;
        }
     
    </style>

</head>
<body>
    <div class="header">
        <div class="logo">
            <img class="flex" src="assets/images/flex.png" alt="">
        </div>
        <div class="list">
            <ul>
                <li>Product</li>
                <li>Features</li>
                <li>Resources</li>
                <li>Pricing</li>
            </ul>
        </div>
        <div class="btn">
            <button class="login">Login</button>
            <button class="signup">Sign up</button>
        </div>
    </div>
    <div class="parent">
        <div class="part">
            <button class="b1">Header</button>
            <h1>A Small Business is Only as good as its tools</h1>
            <p>we're different. Flex is he only saas business platform that lets you run your business on one platform, seamlessly across all digital channels.</p>
            <button class="b2">Request a Demo</button> &nbsp;<button class="b3">Signup</button>
        </div>
        <div class="part1">
            <img src="https://images.unsplash.com/photo-1510074377623-8cf13fb86c08?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8d29ya3BsYWNlfGVufDB8fDB8fHww" alt="">
        </div>
    </div>
    
</body>
</html>
