<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment1</title>
</head>
<body>
    <!-- listing tags -->
     <!-- type attribute is a style of numbering -->

     <ol type="a">
        <li>song</li>
        <li>movies</li>
     </ol>

     <!-- unordered list -->
     <ul>
        <li>Billy joel</li>
        <li>Adele</li>
        <li>Fleetwood Mac</li>
     </ul>

     <!-- Image tag -->
      <img src="https://www.hollywoodreporter.com/wp-content/uploads/2022/10/Halloween-List-Coraline-Everett-MCDCORA_EC001-H-2022.jpg?w=1296&h=730&crop=1" alt="coraline">

      <!-- anchor tag -->
       <a href="https://www.youtube.com/">click here to go to youtube</a>

      <!-- table tag -->
       
       <table>
         <tr>
            <th>Name</th>
            <th>Age</th>
         </tr>
         <tr>
            <td>A</td>
            <td>18</td>
         </tr>
         <tr>
            <td>B</td>
            <td>20</td>
         </tr>
         
       </table><br>

       <form action="">
         <label for="name">Name</label>
         <input type="text" name="name" id="name"><br><br>

         <label for="password">Password</label>
         <input type="passoword" name="password" id="password">
       </form>
</body>
</html>

<!-- An ordered list (ol) displays items in a specific sequence with numbers or letters to indicate order,
which is used when the sequence matters, such as in step-by-step instructions or rankings. -->

<!-- an unordered list (ul) shows items with bullet points in no particular order, 
making it suitable for listing items where sequence is not important, like features or ingredients. -->

<!-- The alt attribute in an image tag provides alternative text that describes
 the image for screen readers and displays when the image fails to load. -->
