<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body{
            padding: 5px;
        }

        .ch1 {
            max-width: 600px;
            height: 400px;
            border: 1px solid black;
            display: grid;
            gap: 10px;
            grid-template-columns: 2fr  2fr;
          
            background-color: rgba(91, 21, 21, 0.937);
            padding: 30px 10px ;
            
        
        }
        .box1{
        
            background-color:#FDBF27;
            grid-column: span 2;
            
        }
         .box2{
            background-color: pink;
          
           
        }
            .box3{
            
            background-color: red;
        }
            .box4{
            background-color:blue;
        }
            .box5{
           
            background-color:#4D5A28;
            
        }



    </style>
</head>
<body>
    <div class="parent">
        <div class="ch1">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>
            <div class="box4"></div>
            <div class="box5"></div>
        </div>
        <div class="ch2">

        </div>
    </div>

</body>
</html>
